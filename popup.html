<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div style="text-align: center; color: darkgray;"><strong>DPV Links</strong></div>
  <div id="notice" class="link">
    <span>alert!</span>
  </div>
  <div class="link">
  <div class="group">
    <select id="version">
      <option value="2.0">v2.0</option>
      <option value="2.1">v2.1</option>
      <option value="2.2" selected>v2.2</option>
      <option value="2.3-dev">v2.3-dev</option>
    </select>
    <select id="mode">
      <option value="local" selected>local</option>
      <option value="dev">dev</option>
      <option value="live">live</option>
    </select>
  </div>
  </div>
  
  <div id="links"></div>

  <div class="link">
  <div class="group">
    <select id="dpv-module" style="width: 125px;">
      <option value="">DPV module</option>
      <option value="context">context</option>
      <option value="entities">entities</option>
      <option value="legal_basis">legal_basis</option>
      <option value="personal_data">personal_data</option>
      <option value="processing">processing</option>
      <option value="purposes">purposes</option>
      <option value="rights">rights</option>
      <option value="risk">risk</option>
      <option value="rules">rules</option>
      <option value="TOM">TOM</option>
    </select>
    <button id="dpv-module-open">open</button>
  </div>

  <div class="group">
    <select id="legal" style="width: 125px;">
      <option value="index" selected>Legal page</option>
      <option value="at">at</option>
      <option value="be">be</option>
      <option value="bg">bg</option>
      <option value="cy">cy</option>
      <option value="cz">cz</option>
      <option value="de">de</option>
      <option value="dk">dk</option>
      <option value="ee">ee</option>
      <option value="es">es</option>
      <option value="eu">eu</option>
      <option value="fi">fi</option>
      <option value="fr">fr</option>
      <option value="gb">gb</option>
      <option value="gr">gr</option>
      <option value="hk">hk</option>
      <option value="hr">hr</option>
      <option value="hu">hu</option>
      <option value="ie">ie</option>
      <option value="in">in</option>
      <option value="is">is</option>
      <option value="it">it</option>
      <option value="jp">jp</option>
      <option value="kr">kr</option>
      <option value="li">li</option>
      <option value="lt">lt</option>
      <option value="lu">lu</option>
      <option value="lv">lv</option>
      <option value="mo">mo</option>
      <option value="mt">mt</option>
      <option value="my">my</option>
      <option value="nl">nl</option>
      <option value="no">no</option>
      <option value="ph">ph</option>
      <option value="pl">pl</option>
      <option value="pt">pt</option>
      <option value="ro">ro</option>
      <option value="se">se</option>
      <option value="sg">sg</option>
      <option value="si">si</option>
      <option value="sk">sk</option>
      <option value="th">th</option>
      <option value="tw">tw</option>
      <option value="us">us</option>
    </select>
  <button id="legal-open">open</button>
  </div>

  <div class="group">
    <select id="sector" style="width: 125px;">
      <option value="" selected>Sector</option>
      <option value="education/">Education</option>
      <option value="finance/">Finance</option>
      <option value="health/">Health</option>
      <option value="infra/">Infra</option>
      <option value="law/">Law</option>
      <option value="publicservices/">Public Services</option>
    </select>
    <button id="sector-open">open</button>
  </div>

  <div class="group">
    <select id="guide" style="width: 125px;">
      <option value="/guides/index" selected>Guide</option>
      <option value="/primer/index">Primer</option>
      <option value="/guides/consent-27560">Consent-27560</option>
      <option value="/guides/notice-29184">Notice-29184</option>
      <option value="/guides/gdpr-ropa">GDPR-ROPA</option>
      <option value="/guides/gdpr-dpia">GDPR-DPIA</option>
      <option value="/guides/gdpr-data-breach">GDPR-DataBreach</option>
      <option value="/guides/rights">Rights</option>
      <option value="/guides/dpv-odrl">ODRL</option>
      <option value="/guides/dpv-owl">OWL</option>
      <option value="/guides/dpv-skos">RDFS/SKOS</option>
      <option value="/guides/dpv-misc">Misc. Formats</option>
    </select>
    <button id="guide-open">open</button>
  </div>

    <div class="group">
      <select id="milestone" style="width: 90px;">
        <!-- <option value="5">DPV 2.1</option> -->
        <option value="7">2.2</option>
        <option value="9" selected>2.3-dev</option>
        <option value="8">proposed</option>
        <option value="6">scope</option>
      </select>
      <button id="milestone-open">milestone</button>
    </div>
  </div>

  <div class="link">
    <form id="search-form">
      <input type="text" name="search" id="search" placeholder="search">
    </form>
  </div>

  <div class="link">
    <label>debug</label>
    <input id="debug" type="checkbox">
  </div>

  <script src="popup.js"></script>
</body>
</html>
