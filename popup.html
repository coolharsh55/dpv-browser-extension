<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="group">
    <label for="version">Version:</label>
    <select id="version">
      <option value="2.0">2.0</option>
      <option value="2.1-dev" selected>2.1-dev</option>
    </select>
  </div>
  
  <div class="group">
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="local" selected>Local</option>
      <option value="dev">Dev</option>
      <option value="live">Live</option>
    </select>
  </div>
  
  <div id="links"></div>

  <div class="group">
    <label for="dpv-module">DPV module:</label>
    <select id="dpv-module" style="width: 50px;">
      <option value="context">context</option>
      <option value="entities">entities</option>
      <option value="legal_basis">legal_basis</option>
      <option value="personal_data">personal_data</option>
      <option value="processing">processing</option>
      <option value="purposes">purposes</option>
      <option value="rights">rights</option>
      <option value="risk">risk</option>
      <option value="rules">rules</option>
      <option value="TOM">TOM</option>
    </select>
    <button id="dpv-module-open">open</button>
  </div>

  <div class="group">
    <label for="legal">Legal:</label>
    <select id="legal">
      <option value="index" selected>index</option>
      <option value="at">AT</option>
      <option value="be">BE</option>
      <option value="bg">BG</option>
      <option value="cy">CY</option>
      <option value="cz">CZ</option>
      <option value="de">DE</option>
      <option value="dk">DK</option>
      <option value="ee">EE</option>
      <option value="es">ES</option>
      <option value="eu">EU</option>
      <option value="fi">FI</option>
      <option value="fr">FR</option>
      <option value="gb">GB</option>
      <option value="gr">GR</option>
      <option value="hr">HR</option>
      <option value="hu">HU</option>
      <option value="ie">IE</option>
      <option value="in">IN</option>
      <option value="is">IS</option>
      <option value="it">IT</option>
      <option value="li">LI</option>
      <option value="lt">LT</option>
      <option value="lu">LU</option>
      <option value="lv">LV</option>
      <option value="mt">MT</option>
      <option value="nl">NL</option>
      <option value="no">NO</option>
      <option value="pl">PL</option>
      <option value="pt">PT</option>
      <option value="ro">RO</option>
      <option value="se">SE</option>
      <option value="si">SI</option>
      <option value="sk">SK</option>
      <option value="us">US</option>
    </select>
  <button id="legal-open">open</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
